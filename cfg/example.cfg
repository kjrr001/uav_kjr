# uav_kjr control file: one block. "KEY : value", '#' = comment, relative paths = from this file.
# kjr_run --keys lists every key and its default, kjr_run --stages the stages.
TITLE        : example block
BLOCK        : JJ3
INCLUDE      : common.cfg

# input / output (required)
INPUT_DIR    : /work/eridu_drone/JJ-3                    # camera images *.jpg
GCP_FILE     : /work/eridu_drone/final_output_jj3/gcp_list_v2.txt
WORK_DIR     : /work/eridu_drone/kjr/runs/${BLOCK}
OUTPUT_DIR   : /work/eridu_drone/kjr/products/${BLOCK}

# stage range (name or number)
START        : SFM_FEATURE
END          : DIAG
EXISTING     : skip                     # skip | archive | delete

# optional (defaults shown)
# SFM_SOURCE   : opensfm                 # or a finished ODM run dir (stages 1-4 then not used)
# REF_DSM      : auto                    # auto | stereo | <tif>
# SHAPE_DSM    : ref                     # ref | self | <tif>
# GSD          : auto
# BLEND_SIGMA  : 30
# BBA_ITERS    : 30
# BBA_OPTIONS  :
# TIE_WORKERS  : 2
# USE_TRACKS   : no
# PRODUCT_NAME : ${BLOCK}_kjr
# EXPORT_DIR   :                         # END : EXPORT -> EXPORT_DIR/<BLOCK>
# REGIONAL_DEM :
