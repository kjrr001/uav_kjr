# ======================================================================================
#  uav_kjr 표준 공통 설정                                            manual/templates/common.cfg
# ======================================================================================
#  한 컴퓨터(또는 한 프로젝트)의 블록들이 같이 쓰는 값. 블록 cfg 가 INCLUDE 한다.
#  블록 cfg 에 같은 항목이 있으면 블록 cfg 값이 이긴다.
#  아래 경로는 이 서버(2026-10) 기준. 다른 컴퓨터에서는 manual/README.md §2 대로 설치하고 고친다.
# ======================================================================================

KJR_ENV      : /work/eridu_drone/kjr/env             # KJR 파이썬 환경 (numpy, opencv, gdal, torch, cuda-python)
UAV_LIB      : /work10/planet_stereo/UAV             # UAV 정합 라이브러리 (tie point, census-SGM)
OSFM_ENV     : /work/eridu_drone/kjr/opensfm/env     # OpenSfM 환경 (tools/build_opensfm.sh)
OSFM_SRC     : /work/eridu_drone/kjr/opensfm/src     # OpenSfM 소스 (65571c8a, 수정 없음)

EXISTING     : skip                                   # 프로젝트 기본 처리 방식
