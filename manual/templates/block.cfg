# ======================================================================================
#  uav_kjr 표준 컨트롤 파일 (블록 하나)                               manual/templates/block.cfg
# ======================================================================================
#  형식: 한 줄에 "항목 : 값".  '#' 뒤는 주석.  항목 이름은 영문 (대소문자 구분 없음).
#  상대경로는 이 파일이 있는 폴더 기준.  ${BLOCK} 처럼 다른 항목 값을 쓸 수 있다.
#  값을 비워 두거나 줄을 지우면 기본값.  확인: kjr_run <이 파일> --dry-run
#  <...> 로 된 곳을 채운다 (manual/templates/new_block.sh 가 자동으로 채운다).
# ======================================================================================

TITLE        : <설명, 예: Eridu JJ-3 2026-07 촬영>
BLOCK        : <BLOCK>                  # 블록 이름. 제품 파일 이름과 로그에 쓰인다 (영문·숫자)
INCLUDE      : common.cfg               # 공통 설정 (환경 경로). 이 파일의 값이 우선한다

# ---------------------------------------------------------------- 입력 / 출력 (필수)
INPUT_DIR    : <INPUT_DIR>              # 원본 사진 폴더 (*.jpg). 읽기만 한다
GCP_FILE     : <GCP_FILE>               # GCP 목록 (첫 줄 좌표계, 다음 줄부터 E N Z x y 사진 [id])
WORK_DIR     : work/${BLOCK}            # 중간 결과 (블록당 약 10 GB)
OUTPUT_DIR   : products/${BLOCK}        # 제품 (블록당 약 7 GB)

# ---------------------------------------------------------------- 실행 범위
#   1 SFM_FEATURE  2 SFM_MATCH  3 SFM_RECON  4 GEOREF  5 PAIRS  6 TIEPOINT  7 TRACKS  8 BBA
#   9 UNDISTORT  10 DSM_EXTRACTION  11 FUSE  12 BLEND  13 ORTHO  14 PRODUCTS  15 DIAG  16 EXPORT
START        : SFM_FEATURE              # 첫 단계 (이름 또는 번호)
END          : DIAG                     # 마지막 단계. 전달 폴더까지 만들려면 EXPORT
EXISTING     : skip                     # 결과가 이미 있는 단계: skip | archive | delete
                                        #   skip    끝난 단계는 건너뛰고, 덜 끝난 단계는 이어서
                                        #   archive 다시 실행, 옛 결과는 WORK_DIR/old/<시각>/ 로 옮김
                                        #   delete  다시 실행, 옛 결과는 지움

# ---------------------------------------------------------------- SfM (1-4단계)
SFM_SOURCE   : opensfm                  # opensfm | <끝난 ODM 처리 폴더> (그러면 1-4단계 없이 그 결과에서 시작)
CAMERA_OVERRIDES : auto                 # auto = EXIF 초점거리에서 시작하는 brown 모델 | camera_models_overrides.json
OSFM_PROCESSES : auto                   # OpenSfM 프로세스 수. auto = CPU 수 - 2
# OSFM_CONFIG  :                        # OpenSfM 설정 파일. 기본 tools/opensfm_config.yaml
GSD          : auto                     # 정사영상 해상도 (m). auto = 비행고도 / 초점거리
REF_CELL     : 2                        # SfM 점으로 만드는 참조 DSM 격자 (m)

# ---------------------------------------------------------------- 번들 조정, DSM
TIE_WORKERS  : 2                        # tie point 병렬 작업 수 (GPU 8 GB 기준 2)
USE_TRACKS   : no                       # yes = 다중 사진 트랙 (7 TRACKS) 사용. 보통 no
BBA_ITERS    : 30                       # 번들 조정 반복 횟수
BBA_OPTIONS  :                          # bba.py 추가 옵션. 예: --sig-gcp 0.03
REF_DSM      : auto                     # 긴 파장 기준 DSM: auto (SfM DSM) | stereo | <tif>
SHAPE_DSM    : ref                      # BLEND 긴 파장 형태: ref (= REF_DSM) | self (보정 안 함) | <tif>
BLEND_SIGMA  : 30                       # 긴 파장 경계 (m). 이보다 긴 기복은 REF_DSM 에서 가져온다

# ---------------------------------------------------------------- 제품, 전달
PRODUCT_NAME : ${BLOCK}_kjr             # 제품 파일 이름 앞부분: <이름>_dsm.tif, <이름>_ortho.tif ...
EXPORT_DIR   :                          # 16 EXPORT: 전달 폴더 (EXPORT_DIR/<BLOCK>/ 에 만든다)
REGIONAL_DEM :                          # 16 EXPORT: 위치도 바탕 DEM (비우면 위치도 없음)
